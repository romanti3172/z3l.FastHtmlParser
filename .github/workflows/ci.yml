name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Nothing here can ask for the OIDC token: only the publish job below, and only for a version tag.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The tests take about a minute: a hang must not hold the job for the default 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # The test project targets net9.0 and net10.0: both builds of the library are tested.
      # Every test is listed; a test that runs longer than 5 minutes is stopped and named in the log.
      - name: Test
        run: >-
          dotnet test tests/z3l.FastHtmlParser.Tests -c Release
          --logger "console;verbosity=normal"
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      # Version comes from the tag: v0.1.0 -> 0.1.0. Untagged builds keep the version of src/Directory.Build.props.
      # Both packages get the same version; z3l.FastHtmlParser.HtmlToMarkdown depends on z3l.FastHtmlParser of it.
      # Packing also compares the public API with the last release (package validation in the csproj):
      # a breaking change fails the build.
      - name: Pack
        shell: bash
        run: |
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARG="-p:Version=${GITHUB_REF_NAME#v}"
          fi
          dotnet pack src/z3l.FastHtmlParser -c Release -o artifacts $VERSION_ARG
          dotnet pack src/z3l.FastHtmlParser.HtmlToMarkdown -c Release -o artifacts $VERSION_ARG

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*

  # Publishes the packages built and tested above: z3l.FastHtmlParser and z3l.FastHtmlParser.HtmlToMarkdown.
  # A separate job, so that pull requests and branch builds never run with the permission to get a nuget.org key.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # nuget.org Trusted Publishing (OIDC), no stored API key
      contents: write   # the GitHub release for the tag
    steps:
      # Only CHANGELOG.md, for the release notes. Before the download: checkout cleans the folder.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived nuget.org key.
      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: romanti3172

      - name: Publish to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # GitHub release for the tag: notes are the version's section of CHANGELOG.md
      # ("## 1.4.0 (date)" up to the next "## "), the .nupkg files are attached. A version with "-" is a prerelease.
      # An existing release for the tag (a rerun) is left as it is.
      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          awk -v v="$VERSION" '/^## /{ if (found) exit; found = ($0 == "## " v || index($0, "## " v " ") == 1); next } found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)." > notes.md
          fi
          echo "" >> notes.md
          echo "NuGet: https://www.nuget.org/packages/z3l.FastHtmlParser/$VERSION ·" \
            "https://www.nuget.org/packages/z3l.FastHtmlParser.HtmlToMarkdown/$VERSION" >> notes.md
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md $PRERELEASE
