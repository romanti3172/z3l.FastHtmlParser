name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Test
        run: dotnet test tests/z3l.FastHtmlParser.Tests -c Release

      # Version comes from the tag: v0.1.0 -> 0.1.0. Untagged builds keep the csproj version.
      - name: Pack
        shell: bash
        run: |
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARG="-p:Version=${GITHUB_REF_NAME#v}"
          fi
          dotnet pack src/z3l.FastHtmlParser -c Release -o artifacts $VERSION_ARG

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*

      - name: Publish to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
