name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Nothing here can ask for the OIDC token: only the publish job below, and only for a version tag.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # The test project targets net9.0 and net10.0: both builds of the library are tested.
      - name: Test
        run: dotnet test tests/z3l.FastHtmlParser.Tests -c Release

      # Version comes from the tag: v0.1.0 -> 0.1.0. Untagged builds keep the csproj version.
      # Packing also compares the public API with the last release (package validation in the csproj):
      # a breaking change fails the build.
      - name: Pack
        shell: bash
        run: |
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARG="-p:Version=${GITHUB_REF_NAME#v}"
          fi
          dotnet pack src/z3l.FastHtmlParser -c Release -o artifacts $VERSION_ARG

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*

  # Publishes the package built and tested above. A separate job, so that pull requests and
  # branch builds never run with the permission to get a nuget.org key.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # nuget.org Trusted Publishing (OIDC), no stored API key
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived nuget.org key.
      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: romanti3172

      - name: Publish to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
